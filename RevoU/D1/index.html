<!DOCTYPE html>
<html lang="en" style="background-color: #cdd7df;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <main>
        <header class="header1">
            <h1 class="text-3xl font-bold">Todo List</h1>
            <p class="watermark">made by fareladsenovs<3</p>
        </header>

        <form>
            <div>
                <label for="todo-input" class="block text-sm font-medium text-gray-700">Add New Task</label>
                <input type="text" id="todo-input" 
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" placeholder="Enter your task here" required>
            </div>

            <div>
                <label for="date-input" class="block text-sm font-medium text-gray-700">Date</label>
                <input type="date" id="date-input" 
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm" placeholder="Enter your task here" required>
            </div>
            
            <div>
                <label for="category-input" class="block text-sm font-medium text-gray-700">Category</label>
                <input type="text" id="category-input"
                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"
                placeholder="Enter category (e.g., work, study)" required>
            </div>

            <div>
                <button type="button" class="px-[26px] py-[-4px] rounded-[8px] bg-blue-500 text-white" 
                onclick="addTask();">+</button>
            </div>
        </form>

        <section class="task-section">
            <div class="action-container pt-[16px] pb-[16px] flex gap-2">
                <select id="filter-category" onchange="renderTasks()" 
                    class="px-3 py-1 rounded bg-white border border-gray-300 text-sm">
                    <option value="all">All Categories</option>
                </select>
                <button id="delete-all-btn" type="button" onclick="deleteAllTasks()" class="px-[26px] py-[-4px] rounded-[8px] bg-gray-500 text-white">Delete All</button>
            </div>


            <header>
            <h2 class="text-1xl font-bold">Todo List</h2>
            </header>

            <div id="todo-container">
                <ul id="todo-list"></ul>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
